# TECH-TOOLCHAIN (04-technical-implementation.md section 1.1)
# Pinned toolchain: Spark 4.1.2, Scala 2.13.16, JDK 17 (the DBR 18 floor; Spark 4.1 has OSS Spark
# Declarative Pipelines).
# Versions are centralized here so every module agrees and the pin is auditable.
scalaVersion = 2.13.16
scalaBinaryVersion = 2.13
# Spark 4.1.2 == DBR 18 floor. The engine targets SPARK CONNECT (TECH-LOWERING-TARGET):
# it builds lazy DataFrame/Column plans against the open-source spark-connect-client-jvm API
# and never assumes a local driver. Deployment is Databricks Connect (a Spark Connect server);
# the same client code runs against a local OSS Connect server for the fast conformance loop.
# NB: the Connect SERVER must match (4.1.2) — a 4.1 client against a 4.0 server is unsupported skew.
sparkVersion = 4.1.2
scalatestVersion = 3.2.19
upickleVersion = 3.3.1

# cqframework stack (org.cqframework, the maintained 4.x line used by clinical-reasoning):
# the CQL->ELM translator (cql-to-elm-jvm) ships IN the engine (CQL is its API surface,
# TECH-ELM-INPUT); the Java CQL engine (engine-jvm) is the test-only ground-truth reference in
# :conformance. Both version-managed by cql-bom so they share one ELM schema (CONF-GROUND-TRUTH).
cqlBomVersion = 4.8.0

org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache=false