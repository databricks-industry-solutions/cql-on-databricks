# Root pytest config, for runs that span components (CI does exactly this).
#
# `importlib` import mode is the point. In the default `prepend` mode a test directory containing an
# `__init__.py` is imported as a package named after that directory, so `examples/tests/` and
# `agent/server/tests/` both become the top-level package `tests` and the second one collected fails
# with `ModuleNotFoundError` — pytest reporting the file as living under the OTHER component's path,
# which is a thoroughly misleading error for a name collision. `importlib` imports each test file under a
# unique name derived from its full path, so component test directories cannot collide however they are
# named or packaged.
#
# Components keep their own `[tool.pytest.ini_options]`; those win when pytest is run from inside one.
[pytest]
addopts = --import-mode=importlib
# Every directory holding Python tests. A bare `pytest` from the repository root therefore runs the whole
# Python surface in one command, which is what CI does.
testpaths =
    compiler/client
    common
    designer
    agent
    loader/synthesizer
    scripts/deploy
    examples
