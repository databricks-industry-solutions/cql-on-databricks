# Log config for the CQL on Databricks Compiler Service JVM.
# The Spark catalyst parser (on the classpath for ResourceStruct.structType / toDDL) dumps
# verbose "== SQL ==" blocks to stdout/stderr.  This file sits on the classpath so log4j2
# picks it up BEFORE anything logs — rootLogger stays at ERROR so genuine failures surface
# while the SQL firehose does not.  Mirrors the engine's connectServer log4j2.properties.

rootLogger.level = error
rootLogger.appenderRef.stdout.ref = console

# Spark whole-stage codegen can dump thousands of lines of generated.java at ERROR when
# it hits the 64KB method limit — benign (falls back to interpreted), but huge.  Pin OFF.
logger.codegen.name = org.apache.spark.sql.catalyst.expressions.codegen.CodeGenerator
logger.codegen.level = off

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex
