// The single testing component (testing-and-conformance.md, modules.md). It holds:
//   * CQL→ELM translation, our own tool on the cqframework cql-to-elm library (TECH-ELM-INPUT);
//   * the ground-truth reference — the maintained Java CQL engine (engine-jvm), run
//     IN-PROCESS (no Node subprocess) (CONF-GROUND-TRUTH);
//   * the golden-plan snapshot mechanism (CONF-GOLDEN-PLAN);
//   * all integration / round-trip / differential tests (src/test).

dependencies {
    implementation project(':compiler:core')
    // BUILD-COMPILE-SERVICE: the compile-service boundary + local host, exercised
    // end-to-end (locally hostable) by CompileHostSpec against the local Connect session.
    implementation project(':compiler:service')
    // CONF-GROUND-TRUTH: the CQF in-memory providers and value normalization (`:compiler:cqf`).
    implementation project(':compiler:cqf')
    // EMIT-SQL-EXECUTE (Phase 5): the SQL back end (`…cqldatabricks.transpiler.*`) is folded into the
    // compiler, which the service dep above already brings transitively — the SQL-path differential
    // lowers a library to a script and diffs it (executed via spark.sql) against the Java reference.
    // EXEC-UDF-LIBRARY (compiler/docs/execution-model.md): the opaque-UDF catalog. The
    // conformance suite (the EXEC-SELFDIFF gate) installs it into the shared Connect session seam
    // (SparkConnect.session -> CqlRuntimeUdfs.install): ship the JAR (`addArtifact`) + register by name.
    // testImplementation because the install is test-only wiring (the production doorway is the client).
    testImplementation project(':compiler:runtime:udf')
    // The JVM execution engine (the direct-execute collect kernel + the session-view
    // staging materializer) lives in conformance (src/test, package `runtime`) — it is validation-only
    // (the sole production doorway is the Python client), so it is not a shipped module.
    implementation "com.lihaoyi:ujson_${scalaBinaryVersion}:${upickleVersion}"

    // The single value-normalizer (JsonNormalize, PROC-DRY) renders the engine's Spark struct
    // `Row` (Quantity/Interval, Phase 3) alongside the reference's runtime values. `Row` is a
    // compile-time-only reference in main here — the test JVM (the Connect CLIENT) supplies it at
    // runtime via the testImplementation jar below; compileOnly keeps it off the server config.
    compileOnly "org.apache.spark:spark-connect-client-jvm_${scalaBinaryVersion}:${sparkVersion}"

    // The cqframework 4.x stack, version-aligned via the BOM so the translator and the
    // ground-truth engine share one ELM schema.
    implementation platform("org.cqframework:cql-bom:${cqlBomVersion}")
    // Translator (front end): CQL → ELM JSON.
    implementation "org.cqframework:cql-to-elm-jvm"
    // Ground-truth reference: the maintained Java CQL engine (successor to
    // org.opencds.cqf.cql:engine), used in-process to evaluate measures.
    implementation "org.cqframework:engine-jvm"
    // FHIR data layer for the reference (Phase 2, DATA-RETRIEVER): R4FhirModelResolver + the
    // RetrieveProvider/DataProvider contracts + transitive HAPI FHIR R4. This is the Java
    // replacement for the JS stack's `cql-exec-fhir`; it lets the reference
    // evaluate FHIR measures patient-by-patient over the same sample data the engine reads.
    implementation "org.cqframework:engine-fhir"
    // HAPI exposes its model only at engine-fhir's runtime scope; the in-memory RetrieveProvider
    // compiles against the R4 model types, so put them on the compile classpath. HAPI versions
    // hapi-fhir-base and the org.hl7.fhir.* structures on separate tracks (8.x vs 6.x); pinned to
    // what engine-fhir resolves.
    implementation "ca.uhn.hapi.fhir:hapi-fhir-base:8.8.1"
    implementation "ca.uhn.hapi.fhir:org.hl7.fhir.r4:6.7.9"
    // UCUM service: the 4.x translator validates quantity units (e.g. Quantities.cql) and
    // refuses to emit ELM without a UCUM implementation on the classpath (LANG-QUANTITY).
    implementation "org.cqframework:ucum"

    // The cqframework 4.x stack is Kotlin and logs via kotlin-logging → slf4j; the slf4j
    // API is not transitive, so add it (+ a no-op binding to keep test output clean).
    implementation "org.slf4j:slf4j-api:2.0.17"
    runtimeOnly "org.slf4j:slf4j-nop:2.0.17"

    // SPARK CONNECT for the differential suite (TECH-LOWERING-TARGET, CONF-GATE-MEASURE).
    // The engine has the client API compileOnly; the conformance test JVM supplies it for real
    // so lowered plans actually execute. The test JVM is a pure Connect CLIENT — it holds ONLY
    // the (shaded) client jar and connects to a Connect server over `sc://`, exactly as it will
    // against Databricks Connect in production. The server runs in a SEPARATE JVM (the
    // `connectServer` configuration + task below); client and server jars must not share a JVM
    // (both define org.apache.spark.sql.SparkSession). Override `cqldatabricks.sparkRemote` to point
    // the SAME suite at a Databricks Connect instance. Scale tests are a separate
    // Databricks-specific project (see docs/deploy.md).
    testImplementation "org.apache.spark:spark-connect-client-jvm_${scalaBinaryVersion}:${sparkVersion}"
}

// The local OSS Spark Connect SERVER classpath, kept OFF the test classpath (collision). Used
// only to launch a server in its own JVM for the fast local loop (`./gradlew :compiler:conformance:connectServer`).
// spark-connect declares spark-core/sql as `provided` (a real distribution supplies them), so the
// full runtime is added explicitly: spark-sql pulls core + catalyst; the connect plugin adds the server.
configurations { connectServer }
dependencies {
    connectServer "org.apache.spark:spark-sql_${scalaBinaryVersion}:${sparkVersion}"
    connectServer "org.apache.spark:spark-connect_${scalaBinaryVersion}:${sparkVersion}"
}

// Translate the authored CQL corpus → ELM JSON (build/elm/), consumed by the engine's Load
// and by the round-trip tests. ELM is a generated artifact, never committed (TECH-ELM-INPUT).
tasks.register('translateCorpus', JavaExec) {
    group = 'cql'
    description = 'Translate authored CQL fixtures (src/test/resources/cql/) into ELM JSON (build/elm/).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.databricks.cql.translate.CqlToElmCli'
    def srcDir = file('src/test/resources/cql')
    def outDir = layout.buildDirectory.dir('elm').get().asFile
    args = [srcDir.absolutePath, outDir.absolutePath]
    inputs.dir(srcDir)
    outputs.dir(outDir)
    // WIPE the ELM dir first (CORE-NO-SILENT-MISLOWER). The translator only WRITES, so a renamed or
    // removed library leaves `build/elm/<old-name>.json` behind, and any spec still naming the old library
    // keeps compiling that SUPERSEDED draft — green, on content no longer in the corpus. Deleting
    // stale output makes a rename fail loudly instead (with Paths.elm's hard error).
    doFirst { delete fileTree(outDir) { include '*.json' } }
}

// JDK 17 module opens required by Spark/Arrow off-heap access (both client and server JVMs).
def sparkJvmOpens = [
    '--add-opens=java.base/java.nio=ALL-UNNAMED',
    '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
    '--add-opens=java.base/java.lang=ALL-UNNAMED',
    '--add-opens=java.base/java.util=ALL-UNNAMED',
    '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED'
]

tasks.named('test') {
    dependsOn 'translateCorpus'
    // EXEC-UDF-LIBRARY: build the opaque-UDF catalog JAR and hand the test JVM its path, so the session
    // seam (SparkConnect.session) can `spark.addArtifact` it to the Connect server and register the
    // catalog by name. Absolute path — the (local or remote) Connect client uploads the file at runtime.
    def udfJar = project(':compiler:runtime:udf').tasks.named('jar')
    dependsOn udfJar
    systemProperty 'cqldatabricks.udfJar', udfJar.get().archiveFile.get().asFile.absolutePath
    // Pin the test worker JVM to UTC (CONF-GROUND-TRUTH). The cqframework reference interprets an
    // offset-less DateTime literal (the date-only Measurement Period default `@2026-01-01T00:00:00`) at
    // the host JVM's default zone; the engine reads Spark `timestamp_ntz` (zone-agnostic, wall-clock ==
    // UTC for this all-`+00:00` corpus). Under a non-UTC host (e.g.
    // EDT) a day-boundary instant like a screening `effective` of `2026-01-01T01:00:00+00:00`
    // shifts a day on the reference side only, flipping `overlaps day of MP` and diverging from the engine.
    systemProperty 'user.timezone', 'UTC'
    systemProperty 'cqldatabricks.elmDir', layout.buildDirectory.dir('elm').get().asFile.absolutePath
    systemProperty 'cqldatabricks.cqlDir', file('src/test/resources/cql').absolutePath
    // Repo root, so the live client E2E (RuntimeCompileE2ESpec) can locate the sibling `client`
    // regardless of the corpus location (the test worker's CWD is the module dir).
    systemProperty 'cqldatabricks.rootDir', rootProject.projectDir.absolutePath
    // The single golden folder (CONF-GOLDEN-PLAN): `<goldenDir>/<fixture>/<artifact>`, mirroring the
    // dump folder. Overridable (like `cqldatabricks.dataDir`) so a golden set can be staged/verified outside
    // `src/` (e.g. reviewing a freshly-blessed artifact under a temp dir before moving it in).
    systemProperty 'cqldatabricks.goldenDir', System.getProperty('cqldatabricks.goldenDir', file('src/test/resources/golden').absolutePath)
    // CONF-PERF-TIME: near-term wall-clock perf gate. `Differential.engineResults` fails a fixture whose
    // Spark collect (`runtimeMs`) exceeds this many ms at corpus volumes (≤33 subjects) — catching a
    // per-row expression re-explosion (a measure's exclusion-arm wall was 102 s). Default 10000; raise only
    // for a deliberately heavier fixture.
    systemProperty 'cqldatabricks.maxRuntimeMs', System.getProperty('cqldatabricks.maxRuntimeMs', '10000')
    // The emit default barrier is a real `CREATE OR REPLACE TABLE`, but the local
    // OSS Spark Connect session catalog does not support REPLACE-TABLE-AS-SELECT, so the CONFORMANCE runs
    // default to the OSS-friendly `CACHE TABLE` barrier here (overridable — e.g. `-Dcqldatabricks.emit.barrier=table`
    // when regenerating a deploy artifact for a Databricks endpoint). Product/default emit stays `table`.
    systemProperty 'cqldatabricks.emit.barrier', System.getProperty('cqldatabricks.emit.barrier', 'cache')
    // CONF-PERF-BUDGET (DORMANT — disabled by removing the `golden/<fixture>/cost.txt` baselines, which
    // churned on every schema/lowering change; re-enable by re-blessing with `-Dcqldatabricks.blessPlans`).
    // Default tolerance band (PERCENT) the structural cost budget seeds into a fresh bless; a committed
    // line's own `band%`/`floor` then overrides it. Kept so the gate re-enables with zero code change.
    systemProperty 'cqldatabricks.costBandPct', System.getProperty('cqldatabricks.costBandPct', '25')
    // Hand-authored FHIR sample data (NDJSON) for the Phase 2 retrieve differential. Absolute
    // path so the (local or remote) Spark Connect server resolves it server-side.
    // Default to the committed fixture data; `-Dcqldatabricks.dataDir=<dir>` overrides it (e.g. a scaled
    // copy under build/ for perf experiments) without touching src.
    systemProperty 'cqldatabricks.dataDir', System.getProperty('cqldatabricks.dataDir', file('src/test/resources/data/fhir').absolutePath)
    // Spark Connect endpoint for the differential suite. Default: a local OSS Connect server
    // (start it with `./gradlew :compiler:conformance:connectServer` in another shell). Plan-executing
    // tests SKIP cleanly when no server is reachable, so the compiler suite stays green with no
    // Spark. Override to run the SAME suite against Databricks Connect:
    //   -Dcqldatabricks.sparkRemote='sc://<host>:443/;token=<pat>;x-databricks-cluster-id=<id>'
    systemProperty 'cqldatabricks.sparkRemote', System.getProperty('cqldatabricks.sparkRemote', 'sc://localhost:15002')
    // Per-CQL keyword filter (the Differential driver honors it): `-Dcqldatabricks.only=FhirVsFunction`
    // runs only matching fixtures and cancels the rest. Forwarded to the forked test JVM.
    def only = System.getProperty('cqldatabricks.only')
    if (only != null) systemProperty 'cqldatabricks.only', only
    // CONF-GATES: when set, an unreachable Connect endpoint FAILS the plan-executing gates instead
    // of skipping them (the CI gate job sets `-Dcqldatabricks.requireConnect=true` so a server that
    // failed to launch can never silently void a required check). Default unset = local skip.
    def requireConnect = System.getProperty('cqldatabricks.requireConnect')
    if (requireConnect != null) systemProperty 'cqldatabricks.requireConnect', requireConnect
    // BUILD-CLIENT: the Python interpreter that runs the client
    // end-to-end driver (RuntimeCompileE2ESpec). Must have pyspark + the cql_databricks package
    // importable. Unset → the live client E2E skips cleanly (like `requireConnect`), so the suite stays
    // green on a host without a configured pyspark client. e.g. -Dcqldatabricks.pyClient=/path/to/venv/bin/python
    def pyClient = System.getProperty('cqldatabricks.pyClient')
    if (pyClient != null) systemProperty 'cqldatabricks.pyClient', pyClient
    // DEBUG-PLAN-DUMP: dump each lowered fixture's OPTIMIZED-plan artifacts into a SINGLE per-fixture
    // subfolder `<dumpDir>/<fixture>/{cql,elm.json,ir.txt,lowered.txt,explain.txt}` (StageDump; the
    // pushdown-ON pass writes them — the OFF self-diff pass is skipped so the optimized artifacts are
    // authoritative; `pre-optimize.ir.txt` only behind `-Dcqldatabricks.dumpPreOptimizeIr`), PLUS a
    // `../test-runtimes.txt` compile-vs-runtime breakdown — all under the one
    // dump flag. DEFAULTS to `build/dump`; each run OVERWRITES the dumps for the fixtures it actually ran
    // and LEAVES every other fixture's dump intact, so a focused run (e.g. `-Dcqldatabricks.only=FhirPeriodWhere`)
    // does NOT erase the dumps from earlier runs. Override the location with `-Dcqldatabricks.dumpDir=<dir>`
    // (e.g. a separate baseline dir). NB: a fixture not run since its source changed can leave a STALE
    // dump — delete `build/dump` by hand for a fresh sweep. This is test-task-only — the engine
    // `Config` default stays off (zero prod cost).
    def defaultDumpDir = layout.buildDirectory.dir('dump').get().asFile
    // Resolve an override against the REPO ROOT and absolutize it (like `cqldatabricks.cqlDir`/`dataDir`): the
    // test worker's CWD is the module dir, so forwarding a RELATIVE `-Dcqldatabricks.dumpDir=compiler/conformance/build/dump`
    // raw would land it in `conformance/conformance/build/dump`. `rootProject.file` makes a relative value
    // repo-root-relative and leaves an absolute one untouched.
    def dumpDirProp = System.getProperty('cqldatabricks.dumpDir')
    def dumpDir = dumpDirProp != null ? rootProject.file(dumpDirProp).absolutePath : defaultDumpDir.absolutePath
    systemProperty 'cqldatabricks.dumpDir', dumpDir
    // CONF-GOLDEN-PLAN: `-Dcqldatabricks.blessPlans=true` stages a regenerated golden artifact into
    // `<dumpDir>/<fixture>/<artifact>` (above) — colocated with the other dump artifacts, NEVER into
    // `src/`; the user reviews and moves the accepted ones into the golden dir by hand. Otherwise the
    // gates tree-compare the actual against the committed golden (`harness.Golden`).
    // `cqldatabricks.grainFirst=<csv>` opts extra fixtures into
    // grain-first lowering for a one-off run (ARCH-GRAIN). Forwarded to the forked JVM.
    // The measures run in the executing corpus by default; `-Dcqldatabricks.skipMeasures=true` drops them for a
    // fast focused iteration. Forwarded to the forked JVM.
    // `cqldatabricks.test=quick|full` is the SINGLE test-tier knob (TestLevel): `quick` (default) runs the
    // fast Tier-0 gates only; `full` adds the slow Tier-3 end-to-end emit gate (EmitE2ESpec). One control,
    // not per-scenario switches. Forwarded to the forked JVM.
    // `cqldatabricks.frontier=true` opts the not-yet-graduated measures (Corpus.frontierMeasures) into the
    // executable corpus for a focused iteration, without wedging the default green
    // suite; `cqldatabricks.measureReport`/`measureReportDetail` toggle the pseudo-MeasureReport dump.
    ['cqldatabricks.blessPlans', 'cqldatabricks.skipMeasures', 'cqldatabricks.cseDebug', 'cqldatabricks.grainFirst', 'cqldatabricks.noGrainFirst', 'cqldatabricks.conditionalUnion', 'cqldatabricks.cteDefs', 'cqldatabricks.retrieveViews', 'cqldatabricks.protoDump', 'cqldatabricks.dumpRawProto', 'cqldatabricks.dumpPreOptimizeIr', 'cqldatabricks.updateGolden', 'cqldatabricks.dumpExplain',
     'cqldatabricks.frontier', 'cqldatabricks.measureReport', 'cqldatabricks.measureReportDetail',
     'cqldatabricks.test', 'cqldatabricks.materialize.mode', 'cqldatabricks.materialize.cost_threshold', 'cqldatabricks.barrierTrace', 'cqldatabricks.testHeap',
     // DATA-RETRIEVE-BARRIER-OPT: re-run the corpus with filtered retrieve reads promoted to their own
     // barrier objects. The barrier is a pure restructuring, so `retrieves=all` MUST diff clean against
     // the reference — that run is the correctness gate for the feature (`Differential.withMaterialize`).
     'cqldatabricks.materialize.retrieves', 'cqldatabricks.materialize.retrieve_min_reuse',
     // Two-layer eval S1 (EXEC-SQL-BACKEND): the SQL emitter is the PRIMARY execution substrate now — the
     // SQL differential ([[SqlDifferentialSpec]]) runs by default. `cqldatabricks.protoBackend=true` opts the
     // DataFrame/Connect-proto gates ([[DifferentialSpec]], [[PlanShapeSpec]]) back in; `cqldatabricks.sqlBackend`
     // survives only as a legacy no-op knob. The emit-size cap guards the SQL dump on a blown-up measure.
     'cqldatabricks.protoBackend', 'cqldatabricks.sqlBackend', 'cqldatabricks.sqlMaxStmtBytes',
     // Opt-in measure throughput scale harness (MeasureScaleSpec): skips by default, so these only matter
     // when a scale sweep is explicitly requested.
     'cqldatabricks.scale', 'cqldatabricks.scaleFactors', 'cqldatabricks.scaleMeasure',
     // Calc-only single-core bench (MeasureCalcOnlySpec): output dir + shuffle partitions.
     'cqldatabricks.pyudfDir', 'cqldatabricks.shufflePartitions',
     // FixtureScaleSpec throughput mode (count-only, no CQF/collect) — for 1M-patient encoding sweeps.
     'cqldatabricks.throughput',
     // Opt-in het-Choice analysis-blowup characterization harness (HetChoiceScaleSpec): skips by default.
     'cqldatabricks.hetScale', 'cqldatabricks.hetScaleNavs',
     // Opt-in Spark-free emitted-SQL size probe (EmitSizeSpec): the plan-shape optimization proxy.
     'cqldatabricks.emitSize', 'cqldatabricks.emitSizeMeasure', 'cqldatabricks.emitSizePerStmt', 'cqldatabricks.emitSizeDumpSql',
     // EMIT-SQL-RETRIEVE-DEMAND-BOUND (opt-in): mount each retrieve view narrowed to the compiler's demand.
     'cqldatabricks.demandMount',
     // Opt-in per-define reference failure isolation (RefDebugSpec, CONF-REF-ANSWER-KEY debugging).
     'cqldatabricks.refDebug', 'cqldatabricks.refDebugSubject'].each { k ->
        def v = System.getProperty(k)
        if (v != null) systemProperty k, v
    }
    jvmArgs += sparkJvmOpens
    // A multi-library measure lowers to a large Spark Connect plan (an inlined multi-library define DAG with
    // repeated choice/interval dispatch), so the client JVM that builds and serializes it needs more
    // than the JUnit default heap. The SERVER-FREE dump path (PlanShapeSpec) builds the FULL un-barriered
    // measure proto (with the Denominator-Exclusion arms, ~0.7 GB of value[x] CASE text) just to render
    // the lowered tree, so the client needs 4 GB even though the EXECUTING path (behind the materialize
    // barrier) is now small.
    maxHeapSize = System.getProperty('cqldatabricks.testHeap', '4g')
}

// Fast local loop: launch a local OSS Spark Connect server in its OWN JVM (no collision with
// the client on the test classpath). Leave it running in one shell; run `:compiler:conformance:test`
// (or `-t` continuous) in another. Binds sc://localhost:15002.
tasks.register('connectServer', JavaExec) {
    group = 'cql'
    description = 'Run a local OSS Spark Connect server (sc://localhost:15002) for the differential suite.'
    // `src/connectServer/resources/log4j2.properties` is FIRST on the classpath so log4j2 picks it up
    // before anything logs: it pins the root logger to ERROR and kills the per-request query-PLAN spew
    // (the giant `CASE WHEN … struct(ts,…,prec,…) … date_trunc …` blocks that flood the terminal). This
    // dir is NOT on the test/client classpath, so the engine and tests are unaffected.
    classpath = files('src/connectServer/resources') + configurations.connectServer
    mainClass = 'org.apache.spark.sql.connect.SimpleSparkConnectService'
    jvmArgs = sparkJvmOpens + [
        '-Dspark.master=local[*]',
        '-Dspark.connect.grpc.binding.port=15002',
        '-Dspark.ui.enabled=false',
        // Pin the SERVER JVM to UTC (CONF-GROUND-TRUTH). The engine computes temporal values HERE
        // (on the server), and DateTime literals are stored as `timestamp_ntz` (no zone) but rendered/
        // compared via a NTZ→instant cast that resolves the wall-clock in the session zone. With no
        // override that zone is the machine zone (e.g. America/New_York), so sub-day LowBoundary/temporal
        // results shift by the local UTC offset (+5h in EST) versus the UTC-pinned test worker — the
        // `CqlArithmeticFunctionsTest` LowBoundary divergence. `-Duser.timezone=UTC` makes the JVM default
        // UTC, which Spark adopts as `spark.sql.session.timeZone` (the `date_trunc(…, Some(<zone>))` the
        // plan shows), matching the worker's pin so the server and the ground-truth reference agree.
        '-Duser.timezone=UTC',
        // Explicit belt-and-suspenders: governs the NTZ→instant casts directly, independent of how the
        // JVM-default zone is resolved at Spark init.
        '-Dspark.sql.session.timeZone=UTC',
        // Belt-and-suspenders: `spark.log.level` applies only AFTER Spark's logging initializes, so the
        // log4j2.properties above is what actually guarantees silence. Keep this for anything that reads it.
        '-Dspark.log.level=ERROR'
    ]
    // Connect the server's stdin to the launching terminal. `SimpleSparkConnectService.main` keeps the
    // JVM alive by reading stdin; with Gradle's default (an empty/closed stream) that read returns EOF
    // immediately and the main thread BUSY-SPINS a core at 100% for the life of the process (sluggish
    // terminal, wasted CPU, and it never exits cleanly). With the real terminal attached the read BLOCKS
    // (no spin), and closing the terminal sends EOF so the server shuts down cleanly.
    standardInput = System.in
    // Self-heal the port: a previous server (possibly wedged) may still hold :15002, which makes this
    // launch die on `BindException`. Kill whatever is listening there first, so `connectServer` always
    // starts a FRESH server with no manual `kill` step. macOS/Linux (lsof); a no-op if nothing holds it.
    doFirst {
        def proc = ['bash', '-c',
            'PIDS=$(lsof -ti tcp:15002 -sTCP:LISTEN 2>/dev/null); ' +
            'if [ -n "$PIDS" ]; then echo "[connectServer] :15002 held by PID(s) $PIDS — killing for a fresh start"; ' +
            'kill -9 $PIDS 2>/dev/null; sleep 1; fi'
        ].execute()
        proc.waitForProcessOutput(System.out as OutputStream, System.err as OutputStream)
    }
}

// SINGLE-CORE sibling of connectServer: local[1] on sc://localhost:15003, for a fair 1-core-vs-1-core
// Spark-vs-CQF comparison (MeasureCalcOnlySpec / FixtureScaleSpec scaladocs). Only touches :15003, never
// the :15002 server.
tasks.register('connectServer1', JavaExec) {
    group = 'cql'
    description = 'Run a SINGLE-CORE local OSS Spark Connect server (sc://localhost:15003, local[1]).'
    classpath = files('src/connectServer/resources') + configurations.connectServer
    mainClass = 'org.apache.spark.sql.connect.SimpleSparkConnectService'
    jvmArgs = sparkJvmOpens + [
        '-Dspark.master=local[1]',
        '-Dspark.connect.grpc.binding.port=15003',
        '-Dspark.ui.enabled=false',
        '-Dspark.sql.shuffle.partitions=1',
        '-Duser.timezone=UTC',
        '-Dspark.sql.session.timeZone=UTC',
        '-Dspark.log.level=ERROR'
    ]
    standardInput = System.in
    doFirst {
        def proc = ['bash', '-c',
            'PIDS=$(lsof -ti tcp:15003 -sTCP:LISTEN 2>/dev/null); ' +
            'if [ -n "$PIDS" ]; then echo "[connectServer1] :15003 held by PID(s) $PIDS — killing for a fresh start"; ' +
            'kill -9 $PIDS 2>/dev/null; sleep 1; fi'
        ].execute()
        proc.waitForProcessOutput(System.out as OutputStream, System.err as OutputStream)
    }
}
