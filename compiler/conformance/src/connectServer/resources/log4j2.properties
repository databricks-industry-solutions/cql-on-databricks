# Log config for the LOCAL OSS Spark Connect server only (`:compiler:conformance:connectServer`).
# Spark's default INFO logging dumps the full query PLAN per request — the giant
# `CASE WHEN … struct(ts,…,prec,…) … date_trunc …` blocks that flood the terminal and
# choke the machine. `-Dspark.log.level` is applied only after Spark's logging
# initializes, so plan/startup spew can still slip through. This file is on the server
# classpath, so log4j2 picks it up BEFORE anything logs and the root stays at ERROR —
# genuine failures (bind errors, exceptions) still surface; the plan firehose does not.
# This file is NOT on the test/client classpath, so it never affects the engine or tests.

rootLogger.level = error
rootLogger.appenderRef.stdout.ref = console

# Spark's whole-stage codegen hits a 64KB JVM method-size limit on a large measure plan and logs
# the ENTIRE failed `generated.java` at ERROR (thousands of lines) before silently falling back to
# interpreted execution — benign, but huge, and ERROR so the root level above does NOT mute it. A
# genuine, non-recoverable codegen failure still surfaces as a thrown exception (not just a log), so
# turning this logger off loses no real signal. Pin it OFF to kill the firehose.
logger.codegen.name = org.apache.spark.sql.catalyst.expressions.codegen.CodeGenerator
logger.codegen.level = off

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex
