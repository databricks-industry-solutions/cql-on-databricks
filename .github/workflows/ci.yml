# CI for cql-on-databricks.
#
# Two lanes, split by what they need rather than by what they test (decision 5):
#
#   build   Hermetic. Dependencies from Maven Central, a local OSS Spark Connect server the build
#           starts itself, no secrets, no workspace, no internal network. It therefore RUNS ON A
#           FORK, which is the point: an external reviewer of a public CQL compiler can clone,
#           push a branch, and get the same green check a maintainer gets. Most accelerators
#           cannot offer that, because their tests need a live workspace.
#
#   (later) integration  Secret-gated Databricks workspace tests. Runs only on push to main, never
#           on a fork PR, because GitHub withholds secrets from fork pull requests. Lands with the
#           app and platform areas in P3.
#
# Actions are pinned to commit SHAs, not tags: a tag is mutable and a compromised upstream tag is
# the standard supply-chain path into a build. Dependency verification (gradle/verification-metadata.xml)
# independently checksums every resolved artifact.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, neutrality wall, and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17 (TECH-TOOLCHAIN)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@42ebad84b0585498c0413b0967cf4e80ec0e1d19 # v4.4.1

      # ARCH-PURITY (decision 1). Runs BEFORE the tests: if a platform dependency has reached the
      # compiler or the runtime, that is an architecture failure and the test result is not the
      # interesting news. Scoped to compiler + runtime; the client is deliberately outside the wall
      # (decision 10).
      - name: Neutrality wall
        run: ./gradlew checkNeutrality --no-daemon

      # The compiled SQL is validated by executing it against real open-source Apache Spark. The
      # server is a plain spark-sql + spark-connect pair the build itself launches, so this needs
      # no Databricks and no credentials.
      - name: Start local OSS Spark Connect server
        run: |
          nohup ./gradlew :compiler:conformance:connectServer --no-daemon > /tmp/connect-server.log 2>&1 &
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/15002) >/dev/null 2>&1; then
              echo "Connect server listening on :15002 after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "::error::OSS Spark Connect server failed to bind :15002 within 120s"
          tail -50 /tmp/connect-server.log
          exit 1

      # -Dcqldatabricks.requireConnect=true turns "no server reachable" from a clean skip into a
      # failure. Without it a broken server would silently reduce the conformance gate to a no-op,
      # which is the failure mode this flag exists to prevent.
      #
      # `--rerun` on the conformance task is LOAD-BEARING because a `-D` system property of the Gradle JVM
      # is not a task input. A `:compiler:conformance:test` task whose outputs are up-to-date — from an
      # earlier run where the specs SKIPPED for want of a server — is NOT re-executed, and the step
      # reports BUILD SUCCESSFUL having run nothing. This flag forces re-execution and prevents that no-op.
      - name: Tests (conformance gate)
        run: ./gradlew :compiler:conformance:test --rerun -Dcqldatabricks.requireConnect=true --no-daemon

      # The rest of the JVM suite (compiler, service, host, runtime) — ordinary up-to-date checks are
      # correct here, because none of these specs is gated on a reachable server.
      - name: Tests (rest of the JVM suite)
        run: ./gradlew test -Dcqldatabricks.requireConnect=true --no-daemon

      # BUILD-CLIENT. Runs on the stdlib alone — no pyspark, no pytest, no Databricks SDK — because the
      # platform modules import lazily and the workspace seams are driven with fakes. So the client is
      # covered on a fork's CI too, not only where a workspace exists.
      - name: Client tests
        run: ./gradlew clientTest --no-daemon

      # The app and agent areas: Python backend + React frontend. The frontend's fixture generation
      # (npm `pretest`) runs the compiler's own translator over the vendored corpus, so the UI tests are
      # checked against ELM this repository produces rather than a file someone once generated by hand.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Python tests (client, services, components, examples)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          # Install each component with its TEST EXTRAS, not a hand-listed set of packages. Those extras
          # are where a component declares what its suite needs, and a missing one does not fail here —
          # it makes tests SKIP. The Specification-schema gate (25 tests) was skipping in CI for exactly
          # that reason: `xmlschema` lives in the Designer server's `dev` extra and CI installed the bare package.
          .venv/bin/pip install -q -e ./compiler/client -e './common[test]' -e './designer/server[dev]' -e './agent[test]' \
            -e './loader/synthesizer[dev]' -e './loader/importer[dev,spark]' pytest
          # testpaths in the root pytest.ini names every directory holding Python tests, so this covers
          # the whole Python surface and a new component's tests are picked up by adding it there.
          .venv/bin/python -m pytest -q

      - name: Frontend tests
        working-directory: designer
        run: |
          npm ci
          npm test

      - name: Connect server log
        if: failure()
        run: tail -200 /tmp/connect-server.log || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: '*/build/reports/tests/test'
          retention-days: 7
          if-no-files-found: ignore
